[project]
name = "cml-backend"
version = "0.1.6"
description = "Local backend service for the CML desktop app."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.136.3",
  "starlette==1.0.1",
  "uvicorn[standard]==0.48.0",
  "pydantic-settings==2.14.1",
  "cryptography==47.0.0",
  "numpy==2.4.6",
  "opendataloader-pdf==2.4.7",
  "pypdf==6.12.2",
  "python-docx==1.2.0",
  "PyMuPDF==1.26.7",
  "ocrmypdf==17.5.0"
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers==5.5.1"
]

[project.scripts]
odin = "app.odin_cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
