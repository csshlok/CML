[project]
name = "cml-backend"
version = "0.1.0"
description = "Local backend service for the CML desktop app."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
