[project]
name = "cml-backend"
version = "0.1.7"
description = "Local backend service for the CML desktop app."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.136.3",
  "starlette==1.0.1",
  "uvicorn[standard]==0.48.0",
  "pydantic-settings==2.14.1",
  "cryptography==47.0.0",
  "numpy==2.4.6",
  "opendataloader-pdf==2.4.7",
  "pypdf==6.12.2",
  "python-docx==1.2.0",
  "PyMuPDF==1.26.7",
  "ocrmypdf==17.5.0",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-java==0.23.5",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4"
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers==5.5.1"
]

[project.scripts]
odin = "app.odin_cli:main"
odin-credential-helper = "app.odin_credential_helper:main"

[tool.ruff]
line-length = 100
target-version = "py311"
