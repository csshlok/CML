name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packaged_smoke:
        description: Build and smoke-test the Windows release candidate
        required: false
        default: false
        type: boolean
      publish_release:
        description: Build from release_tag and attach the verified Windows installer
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing GitHub release tag used when publish_release is enabled
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/contributors-backend.txt
      - name: Audit production desktop dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit critical build dependencies
        run: npm audit --audit-level=critical
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.0
          python -m pip_audit -r requirements/contributors-backend.txt --progress-spinner off

  desktop:
    name: Desktop typecheck, shell tests, and build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run test:extension
      - run: npm run security:renderer
      - run: npm run audit:controls
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:desktop:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-playwright-results
          path: test-results
          if-no-files-found: warn

  backend:
    name: Backend ${{ matrix.tier }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tier: [quick, integration, system, benchmark]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            requirements/contributors-backend.txt
      - name: Install backend and test dependencies
        run: >-
          python -m pip install -e "./backend[test]"
          pytest==9.0.3 pytest-timeout==2.4.0
          psutil==7.2.2 httpx==0.28.1 requests==2.34.2
          fpdf2==2.8.7 pillow==12.3.0
      - name: Run ${{ matrix.tier }} suite
        shell: pwsh
        run: >-
          ./scripts/backend/run-tests.ps1
          -Tier ${{ matrix.tier }}
          -Python python
          -JunitPath test-results/backend-${{ matrix.tier }}.xml
      - name: Check Python formatting and imports
        if: matrix.tier == 'quick'
        run: python -m ruff check backend/app backend/tests
      - name: Compile Python sources
        if: matrix.tier == 'quick'
        run: python -m compileall -q backend/app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-${{ matrix.tier }}-results
          path: test-results/backend-${{ matrix.tier }}.xml
          if-no-files-found: warn

  odin-scale:
    name: Odin scale gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install -e ./backend
          pytest==9.0.3 pytest-timeout==2.4.0 psutil==7.2.2
      - name: Run explicit scale suite
        shell: pwsh
        run: ./scripts/backend/run-tests.ps1 -Tier scale -Python python

  packaged-smoke:
    name: Windows packaged release-candidate smoke
    if: github.event_name == 'workflow_dispatch' && (inputs.packaged_smoke || inputs.publish_release)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_release && inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "./backend[test]" playwright==1.60.0 psutil==7.2.2
      - name: Build Windows package
        shell: pwsh
        run: |
          if ("${{ inputs.publish_release }}" -eq "true") {
            if ([string]::IsNullOrWhiteSpace("${{ inputs.release_tag }}")) {
              throw "release_tag is required when publish_release is enabled."
            }
            npm --workspace @cml/desktop run package:win -- --Release
          } else {
            npm run package:win
          }
      - name: Smoke unpacked startup and renderer
        shell: pwsh
        run: |
          ./scripts/packaging/smoke-packaged-runtime.ps1 -PackageRoot apps/desktop/release/win-unpacked
          ./scripts/packaging/smoke-packaged-app-launch.ps1 -PackageRoot apps/desktop/release/win-unpacked
          python scripts/packaging/smoke-packaged-ui.py --package-root apps/desktop/release/win-unpacked --report test-results/packaged-ui.json --screenshot test-results/packaged-ui.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaged-smoke-results
          path: test-results
          if-no-files-found: warn
      - name: Attach verified installer to GitHub release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $installer = "apps/desktop/release/CML-$version-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected release installer was not produced: $installer"
          }
          gh release upload "${{ inputs.release_tag }}" $installer --repo "${{ github.repository }}" --clobber
