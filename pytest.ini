[pytest]
testpaths = backend/tests
addopts = --strict-markers
timeout = 120
timeout_method = thread
faulthandler_timeout = 60
markers =
    integration: API and persistence tests that exercise several backend subsystems.
    system: process, runtime, migration, or vault lifecycle tests.
    benchmark: benchmark contracts and performance-support tooling.
    scale: expensive release-gate tests that require an explicit environment opt-in.
norecursedirs =
    .git
    .venv
    node_modules
    apps/desktop/packaging
    apps/desktop/release
    tmp
