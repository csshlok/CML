<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault</title>
    <link rel="stylesheet" href="./static-window-chrome.css">
    <script defer src="./static-window-chrome.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf6;
        color: #27211d;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 48px));
        text-align: center;
      }
      .brand {
        display: grid;
        place-items: center;
        min-height: 96px;
      }
      .brand-logo {
        display: block;
        width: min(260px, 100%);
        height: auto;
        user-select: none;
      }
      p {
        margin: 24px 0 0;
        color: #766b64;
        font-size: 14px;
      }
      .track {
        width: 100%;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8e1d8;
      }
      .bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #27211d;
        animation: move 1.4s ease-in-out infinite;
      }
      @keyframes move {
        from { transform: translateX(-110%); }
        to { transform: translateX(390%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar { width: 100%; animation: none; opacity: .55; }
      }
    </style>
  </head>
  <body>
    <header class="vault-static-window-chrome" aria-label="Window controls">
      <div class="vault-static-window-controls">
        <button class="vault-static-window-control" type="button" data-action="minimize" aria-label="Minimize" title="Minimize">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
        <button class="vault-static-window-control" type="button" data-action="maximize" aria-label="Maximize" title="Maximize">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
        <button class="vault-static-window-control" type="button" data-action="close" aria-label="Close" title="Close">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main role="status" aria-live="polite">
      <div class="brand">
        <img
          class="brand-logo"
          src="../dist/client/brand/Container.svg"
          alt="Vault"
          draggable="false"
          onerror="this.hidden=true"
        >
      </div>
      <p>Opening your library…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
