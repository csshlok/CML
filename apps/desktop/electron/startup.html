<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf6;
        color: #27211d;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 48px));
        text-align: center;
      }
      .brand {
        display: grid;
        place-items: center;
        min-height: 96px;
      }
      .brand-logo {
        display: block;
        width: min(260px, 100%);
        height: auto;
        user-select: none;
      }
      .brand-fallback {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand-fallback svg {
        width: 72px;
        height: 72px;
      }
      p {
        margin: 24px 0 0;
        color: #766b64;
        font-size: 14px;
      }
      .track {
        width: 100%;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8e1d8;
      }
      .bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #27211d;
        animation: move 1.4s ease-in-out infinite;
      }
      @keyframes move {
        from { transform: translateX(-110%); }
        to { transform: translateX(390%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar { width: 100%; animation: none; opacity: .55; }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="brand">
        <img
          class="brand-logo"
          src="../dist/client/brand/Container.svg"
          alt="Vault"
          draggable="false"
          onerror="this.hidden=true;this.nextElementSibling.hidden=false"
        >
        <div class="brand-fallback" hidden aria-label="Vault">
          <svg viewBox="0 0 72 72" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="4">
              <path d="M36 2v20M36 50v20M2 36h20M50 36h20M12 12l14 14M46 46l14 14M60 12L46 26M26 46L12 60"/>
              <path d="M23 6l8 18M41 48l8 18M6 23l18 8M48 41l18 8M49 6l-8 18M31 48l-8 18M66 23l-18 8M24 41L6 49"/>
              <circle cx="36" cy="36" r="12" fill="#fbfaf6"/>
            </g>
          </svg>
          <span>VAULT</span>
        </div>
      </div>
      <p>Opening your library…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
