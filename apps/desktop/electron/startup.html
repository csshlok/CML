<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vault</title>
    <link rel="stylesheet" href="./static-window-chrome.css">
    <script defer src="./static-window-chrome.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 48px));
        text-align: center;
      }
      .brand {
        display: grid;
        place-items: center;
        min-height: 96px;
      }
      .brand-logo {
        position: relative;
        display: block;
        width: min(260px, 100%);
        aspect-ratio: 260 / 118;
        overflow: hidden;
        user-select: none;
      }
      .brand-logo-art {
        position: absolute;
        inset: 0;
        background-image: url("../dist/client/brand/Frame%208.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: 320% auto;
        mix-blend-mode: multiply;
      }
      :root[data-theme="dark"] .brand-logo-art {
        background-image: url("../dist/client/brand/Frame%208%20inverted.svg?v=3");
        mix-blend-mode: normal;
      }
      p {
        margin: 24px 0 0;
        color: var(--text-muted);
        font-size: 14px;
      }
      .track {
        width: 100%;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--border-input);
      }
      .bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: var(--text-primary);
        animation: move 1.4s ease-in-out infinite;
      }
      @keyframes move {
        from { transform: translateX(-110%); }
        to { transform: translateX(390%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar { width: 100%; animation: none; opacity: .55; }
      }
    </style>
  </head>
  <body>
    <header class="vault-static-window-chrome" aria-label="Window controls">
      <div class="vault-static-window-controls">
        <button class="vault-static-window-control" type="button" data-action="minimize" aria-label="Minimize" title="Minimize">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
        <button class="vault-static-window-control" type="button" data-action="maximize" aria-label="Maximize" title="Maximize">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
        <button class="vault-static-window-control" type="button" data-action="close" aria-label="Close" title="Close">
          <span class="vault-static-window-control-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main role="status" aria-live="polite">
      <div class="brand">
        <span class="brand-logo" role="img" aria-label="Vault">
          <span class="brand-logo-art" aria-hidden="true"></span>
        </span>
      </div>
      <p>Opening your library…</p>
      <div class="track" aria-hidden="true"><div class="bar"></div></div>
    </main>
  </body>
</html>
