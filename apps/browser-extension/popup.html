<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="eyebrow">Vault extension</div>
        <h1>Save to Vault</h1>
        <p>Choose what to save from the active page.</p>
      </header>

      <section class="card">
        <label class="field">
          <span>Import desktop setup</span>
          <textarea id="setupJson" rows="5" placeholder='{"backend_url":"http://127.0.0.1:7343","extension_token":"..."}'></textarea>
        </label>
        <div class="row">
          <button id="importSetup" class="button button-primary">Import setup</button>
          <button id="checkStatus" class="button">Check connection</button>
        </div>
      </section>

      <section class="card">
        <div class="summary" id="setupSummary">Import setup from Vault to enable capture.</div>
      </section>

      <section class="card">
        <div class="capture-preview" id="capturePreview">Checking the active page…</div>
        <div class="stack">
          <button id="capturePage" class="button button-primary">Save page</button>
          <button id="captureSelection" class="button">Save selection</button>
          <button id="capturePdfLink" class="button" hidden>Save PDF link</button>
          <button id="captureScreenshot" class="button">Save screenshot</button>
          <label class="button file-button" for="captureFile">Save a file</label>
          <input id="captureFile" type="file" hidden />
        </div>
      </section>

      <section class="status" id="status">Waiting for setup.</section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
