<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CML Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="eyebrow">CML Extension</div>
        <h1>Save To CML</h1>
        <p>Import setup once from the desktop app, then capture links and screenshots without re-entering config.</p>
      </header>

      <section class="card">
        <label class="field">
          <span>Import desktop setup</span>
          <textarea id="setupJson" rows="5" placeholder='{"backend_url":"http://127.0.0.1:7343","extension_token":"..."}'></textarea>
        </label>
        <div class="row">
          <button id="importSetup" class="button button-primary">Import setup</button>
          <button id="checkStatus" class="button">Check connection</button>
        </div>
      </section>

      <section class="card">
        <div class="summary" id="setupSummary">Import setup from the CML desktop app to enable capture.</div>
      </section>

      <section class="card">
        <div class="stack">
          <button id="capturePage" class="button button-primary">Save Link To Vault</button>
          <button id="captureScreenshot" class="button">Take &amp; Save Screenshot</button>
        </div>
      </section>

      <section class="status" id="status">Waiting for setup.</section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
